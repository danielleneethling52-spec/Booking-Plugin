<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmation | ABC Tours</title>
<style>
body { background:#000; color:#fff; font-family:Arial, sans-serif; text-align:center; padding:50px; }
h1 { color:#D4AF37; }
p { color:#ccc; font-size:1.2rem; }
</style>
</head>
<body>

<h1>Booking Confirmed!</h1>
<p id="confirmation"></p>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get('name');
const email = params.get('email');
const phone = params.get('phone');
const checkin = params.get('checkin');
const checkout = params.get('checkout');
const guests = params.get('guests');
const total = params.get('total');
const accommodation = "Forest Edge Nature Retreat";

document.getElementById('confirmation').innerHTML = `
Thank you, <strong>${name}</strong>!<br>
Your booking for <strong>${accommodation}</strong> is confirmed.<br>
Check-in: ${checkin} | Check-out: ${checkout}<br>
Guests: ${guests}<br>
Total Paid: R${total}<br>
Payment confirmed. Booking details will be emailed to you at ${email}.
`;
</script>

</body>
</html>
